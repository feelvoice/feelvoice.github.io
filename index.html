<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="FeelVoice, a personal site for travel, photography, and the everyday.">
  <title>FeelVoice</title>
  <link rel="icon" type="image/png" sizes="64x64" href="./favicon.png">
  <link rel="stylesheet" href="./home.css">
</head>
<body>
  <header class="site-header shell">
    <a class="wordmark" href="./">
      <img src="./portrait.jpg" width="52" height="52" alt="">
      <span>FeelVoice</span>
    </a>
    <nav aria-label="Main navigation">
      <a href="#about">About</a>
      <a href="https://photo.feelvoice.me/">Gallery</a>
      <a href="#sns">SNS</a>
    </nav>
  </header>

  <main class="shell">
    <section class="about" id="about" aria-labelledby="about-title">
      <figure class="travel-map">
        <iframe
          title="Interactive world travel map"
          src="https://map.feelvoice.me/#embed"
          width="1060"
          height="526"></iframe>
        <figcaption>
          <a class="text-link" href="https://map.feelvoice.me/">Explore the travel map <span aria-hidden="true">↗</span></a>
        </figcaption>
      </figure>

      <div class="about-copy">
        <p class="section-label">About Me</p>
        <h1 id="about-title">Somewhere in the everyday.</h1>
        <p class="introduction">I’m FeelVoice. This is where I keep the things I see, hear, and want to remember.</p>
      </div>
    </section>
  </main>

  <footer class="site-footer shell" id="sns">
    <p class="section-label">SNS</p>
    <a href="https://github.com/feelvoice">GitHub <span aria-hidden="true">↗</span></a>
  </footer>
</body>
</html>
